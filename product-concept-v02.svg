<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1680" viewBox="0 0 2400 1680" role="img" aria-labelledby="title desc">
<title id="title">Agent WorkFlow：树 · 流 · 账本 概念图</title>
<desc id="desc">苍天（上帝）在树顶观察一切、记账、统计时间、只示警不干预。根（皇帝）提出目标、监听上行消息、改写为新 I。I 输入自上而下可篡改，O 产物自下而上不可篡改并逐级验收（通过/跳过/打回）。一切相邻交易生成消息碎片，串成全局单链账本。</desc>
<defs>
  <marker id="blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#376BC5"/></marker>
  <marker id="green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#428E76"/></marker>
  <marker id="orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#CC873C"/></marker>
  <marker id="purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#9273AE"/></marker>
  <marker id="red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#C0563F"/></marker>
</defs>
<rect width="2400" height="1680" fill="#F7F9FC"/>
<text x="100" y="78" text-anchor="start" fill="#70809A" font-family="Hiragino Sans GB, Arial, sans-serif" font-size="25" font-weight="600">AGENT WORKFLOW / V0.2 · 第一性原理概念图</text><text x="100" y="168" text-anchor="start" fill="#182B48" font-family="Hiragino Sans GB, Arial, sans-serif" font-size="64" font-weight="600">一棵树 · 一条链 · 一个流</text><text x="103" y="221" text-anchor="start" fill="#697B92" font-family="Hiragino Sans GB, Arial, sans-serif" font-size="29" font-weight="400">一切皆节点 · 相邻才交易 · 流即 IO · I 可变 O 不变 · 苍天有眼、天子执政</text><rect x="640" y="290" width="1120" height="128" rx="28" fill="#F1EBFA" stroke="#B9A3DF" stroke-width="2"/><text x="1200" y="348" text-anchor="middle" fill="#5B3E96" font-family="Hiragino Sans GB, Arial, sans-serif" font-size="40" font-weight="600">苍天 · 上帝（全局 Agent）</text><text x="1200" y="392" text-anchor="middle" fill="#7A63A8" font-family="Hiragino Sans GB, Arial, sans-serif" font-size="27" font-weight="400">观察一切 · 记账 · 统计时间 · 只示警不干预</text><rect x="940" y="505" width="520" height="140" rx="24" fill="#FBF3E0" stroke="#D8B877" stroke-width="2"/><text x="1200" y="560" text-anchor="middle" fill="#7A5B1E" font-family="Hiragino Sans GB, Arial, sans-serif" font-size="38" font-weight="600">根节点 · 皇帝（天子）</text><text x="1200" y="602" text-anchor="middle" fill="#8F7440" font-family="Hiragino Sans GB, Arial, sans-serif" font-size="26" font-weight="400">提出目标（木头 → 椅子）· 唯一监听者</text><text x="1200" y="634" text-anchor="middle" fill="#8F7440" font-family="Hiragino Sans GB, Arial, sans-serif" font-size="26" font-weight="400">改写消息为新 I · 剪枝解死锁</text><rect x="1880" y="500" width="330" height="750" rx="24" fill="#FFFDF6" stroke="#E4D8BC" stroke-width="2"/><text x="2045" y="545" text-anchor="middle" fill="#7A5B1E" font-family="Hiragino Sans GB, Arial, sans-serif" font-size="32" font-weight="600">全局单链账本</text><text x="2045" y="574" text-anchor="middle" fill="#A08C5A" font-family="Hiragino Sans GB, Arial, sans-serif" font-size="21" font-weight="400">只追加 · prevHash · 不可