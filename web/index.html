<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agent-workflow</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="term" id="term">
    <section class="output" id="output" aria-live="polite"></section>
    <form class="input-line" id="input-line" autocomplete="off">
      <span class="prompt" id="prompt">❯</span>
      <input
        id="input"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="command input"
      />
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
